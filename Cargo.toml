[package]
name = "autoinit"
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
license = "MIT OR Apache-2.0"

[features]
nmstate = ["dep:nmstate"]

[[bin]]
name = "autoinit-nmstate"
path = "src/bin/autoinit-nmstate.rs"
required-features = ["nmstate"]

[dependencies]
anyhow = "1"
rustix = { version = "1", features = ["fs", "mount", "process", "rand", "stdio", "system"] }
linux-kernel-cmdline = "0.1.1"
composefs = { version = "0.10.0", features = ["pre-6.15"] }
serde = { version = "1", features = ["derive"] }
toml = { version = "1", default-features = false, features = ["std", "serde", "parse"] }
nmstate = { version = "2.2.62", optional = true, default-features = false, features = ["query_apply"] }
uuid = { version = "1", default-features = false }
# Unify with composefs' OpenSSL dependency, building the static archive.
openssl = { version = "0.10", features = ["vendored"] }

[dev-dependencies]
tempfile = "3"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true

[workspace]
members = ["xtask"]
default-members = ["."]
resolver = "2"
